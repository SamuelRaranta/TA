  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA Service Worker Registration with Instant Update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker aktif:', reg.scope);
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] Versi baru terdeteksi, memperbarui cache...');
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((err) => console.warn('[PWA] Gagal mendaftarkan Service Worker:', err));

          // Simpan status update secara halus tanpa memaksa reload mendadak saat user sedang aktif scroll
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[PWA] Kontroler Service Worker diperbarui dengan aman.');
            window.dispatchEvent(new CustomEvent('agriconnect:sw_updated'));
          });
        });
      }
    </script>
  </body>
