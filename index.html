<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriConnect — Marketplace Hasil Pertanian Skala Besar & Binding Agreement</title>
    <meta name="description" content="Platform B2B pertanian yang menghubungkan petani produsen dengan pembeli distributor secara langsung, dilengkapi fitur Penawaran Terikat (Binding Agreement)." />
    
    <!-- PWA Web App Manifest & Android/iOS Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AgriConnect" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Midtrans Snap Sandbox SDK -->
    <script 
      type="text/javascript" 
      src="https://app.sandbox.midtrans.com/snap/snap.js" 
      data-client-key="%VITE_MIDTRANS_CLIENT_KEY%"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker terdaftar:', reg.scope))
            .catch((err) => console.warn('[PWA] Gagal mendaftarkan Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
